name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Yeni yayımlanan açıklar kod değişmeden de ortaya çıkar: haftalık tarama.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --strict

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install bandit
      # Yalnızca orta ve yüksek önem/güven dereceli bulgular derlemeyi düşürür.
      - run: bandit -r app.py litrag -ll -ii

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
