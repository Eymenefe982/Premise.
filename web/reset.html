<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premise | Reset password</title>
<meta name="description" content="Reset your Premise password.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/auth.css">
<script src="/static/i18n.js"></script>

<link rel="icon" href="/static/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/static/img/logo.png" sizes="512x512">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-brand">Premise<span>.</span></h1>
    <p class="auth-tag" data-i18n="rp.tag">Reset password</p>

    <div class="msg err" id="error" hidden></div>
    <div class="msg ok" id="done" hidden></div>

    <!-- Request a password reset -->
    <form id="request-form">
      <p class="auth-lead" data-i18n="rp.lead">
        Enter your account's email address.
      </p>
      <label class="fld">
        <span data-i18n="auth.email">Email</span>
        <input type="email" id="email" required autocomplete="email" placeholder="jane.doe@example.com">
      </label>
      <button type="submit" class="submit" id="request-submit" data-i18n="rp.submit">Send temporary password</button>
    </form>

    <p class="alt-link"><a href="/giris" data-i18n="rp.backSignin">Back to sign in</a></p>
    <p class="foot">
      <span data-i18n-html="auth.foot">Premise is a literature search and summarisation tool.</span>
      <br><br>
      <a href="/giris" data-i18n="ev.backSignin">Back to sign in →</a>
    </p>
  </div>
</div>

<script>
(function(){
  const err = document.getElementById('error');
  const ok  = document.getElementById('done');
  const requestForm = document.getElementById('request-form');

  const t = (k) => window.I18N.t(k);
  function show(box, text){ window.I18N.fill(box, text); box.hidden = false; }
  function clear(){ err.hidden = true; ok.hidden = true; }

  requestForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clear();
    const btn = document.getElementById('request-submit');
    btn.disabled = true;
    try {
      const res = await fetch('/api/auth/forgot', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email: document.getElementById('email').value.trim() })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { show(err, data.detail || t('rp.failed')); btn.disabled = false; return; }
      requestForm.hidden = true;
      show(ok, t('rp.sent'));
    } catch (_) {
      show(err, t('errors.network')); btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
