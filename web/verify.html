<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premise | Email verification</title>
<meta name="description" content="Verify your Premise email address.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/auth.css">
<script src="/static/i18n.js"></script>

<link rel="icon" href="/static/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/static/img/logo.png" sizes="512x512">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-brand">Premise<span>.</span></h1>
    <p class="auth-tag" data-i18n="ev.tag">Email verification</p>

    <div class="msg info" id="state" data-i18n="ev.verifying">Verifying…</div>
    <p class="alt-link"><a href="/" data-i18n="ev.back">Back to Premise</a></p>
    <p class="foot">
      <span data-i18n-html="auth.foot">Premise is a literature search and summarisation tool.</span>
      <br><br>
      <a href="/giris" data-i18n="ev.backSignin">Back to sign in →</a>
    </p>
  </div>
</div>

<script>
(function(){
  const token = new URLSearchParams(location.search).get('token') || '';
  const box = document.getElementById('state');

  const t = (k) => window.I18N.t(k);
  function set(cls, text){ box.className = 'msg ' + cls; window.I18N.fill(box, text); }

  if (!token) { set('err', t('ev.noToken')); return; }

  fetch('/api/auth/verify', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ token: token })
  }).then(async (res) => {
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      set('ok', t('ev.ok'));
      setTimeout(() => (location.href = '/'), 2500);
    } else {
      set('err', data.detail || t('ev.bad'));
    }
  }).catch(() => set('err', t('errors.network')));
})();
</script>
</body>
</html>
